# configs/run7_phase1.yaml — run7 phase1: 최종 학습, run5_1(epoch15)을 40epoch까지 이어서 완주
#
# 근거: reports/[DIGLAB][0812][장서현]final_retrain_plan.md
#   - Condition Dropout 폐지 확정 (결정 사항, 2026-08-12) → 별도 아키텍처/loss 변경 없음
#   - densify OFF, noise-gate(σ≤0.7), w_lpips=0.002 유지 (확인 사항 1·3·9, run5_1과 동일)
#   - epoch 40 연장 근거는 color 재현축(확인 사항 4) — 방향노이즈 개선은 별도 축, epoch로 해결 보장 안 됨
#
# run5_1_noisegate_phase1.yaml과 model/loss_weights/densify 블록이 전부 동일하다 — 이 파일은
# "새 조건"이 아니라 run5_1을 최종 산출물로 승격시켜 이어 학습하는 것이므로 한 글자도 안 바꿨다.
# 바뀐 건 ① output_dir(run7_phase1로 분리, run5_1 체크포인트 덮어쓰기 방지) ② resume(epoch15 재개) 뿐.
base: configs/base.yaml

# 32ch = 16 latent(z_sketch+λ·matte_bias) + 16 raw anchor. run5_1과 동일 아키텍처 — resume 시
# 가중치 shape이 맞아야 하므로 기본값에 의존하지 않고 명시한다(trainer.py:224-229 기본값과 값은 같음).
model:
  zero_matte_cond: false
  zero_matte_feat: false
  zero_raw_matte: false
  num_extra_conditioning_channels: 16
  matte_bias_zero_init: true
  use_matte_scale: true

training:
  phase: pretrain            # edge off, LPIPS timestep gate (edge는 phase2에서만 켜짐)
  dataset: unbraid           # unbraid 3000 → 187 step/epoch
  epochs: 40                 # cosine LR T_max가 이 값에 묶여 있음(trainer.py:393-403) — 줄이지 말 것
  batch_size: 16             # 누락 금지(기본값 4) — s≈37 전제가 깨짐
  learning_rate: 1.0e-4
  warmup_steps: 500
  mode: forward
  schedule: all
  gate_alpha: 1.0
  # 🔴 착수 전 필수 확인: 이 경로에 optimizer/lr_scheduler/EMA 상태가 포함된 *full* checkpoint가
  #    있어야 한다(가중치만 있는 epoch_15_infer.pth로는 안 됨). 로컬에는 epoch_15_infer.pth만
  #    있고 epoch_15.pth(full)는 H100 서버에 있는지 미확인 상태
  #    (final_retrain_plan.md 확인 사항 5). 없으면 이 resume은 실패하거나(엄밀 검증 시) 혹은
  #    optimizer/lr_scheduler가 초기화된 상태로 조용히 재시작되어 run5_1과의 연속성이 깨진다.
  resume: checkpoints/run5_1_noisegate/epoch_15.pth
  early_stopping: false      # epoch 40 전 조기종료되면 color축 검증(확인 사항 4)이 깨짐

  loss_weights:
    flow: 1.0
    lpips: 0.002              # run4/run5/run5_1과 동일 (final_retrain_plan.md 확인 사항 9)
    edge: 0.0                 # pretrain
    # PixelGen noise gate (논문 Eq.9, tau=0.3), run5_1과 동일.
    # 활성되는 것은 timestep 구간의 하위 70%(HairDiT의 logit-normal+shift=3.0 샘플링에서
    # 실제 활성 샘플은 약 40%, run5 실측 0.4026).
    lpips_noise_cutoff: 0.7
    lpips_gate: noise          # 기본값이지만 명시 (run4의 step-warmup과 구분)
    scale_sync: true
    s_min: 20.0
    s_max: 120.0

  # densify 미적용 — run5 vs run5_1/run4 2×2 팩토리얼에서 densify ON이 방향지표 전부 악화시킴
  # (reports/[DIGLAB][0806][장서현]run5_test_result.md §3.1). enabled=false면 mask_root/thresholds는
  # 안 읽히지만(augmentation.py:333) 무엇을 껐는지 남기려고 값은 유지.
  densify:
    enabled: false
    mask_root: data/densify_masks
    thresholds: [null, 21, 15, 12]

checkpointing:
  # 🔴 run5_1_noisegate/로 두면 같은 파일명으로 경고 없이 덮어쓴다(trainer.py:154는 mkdir만
  #    하고 존재 검사가 없다). 반드시 새 디렉터리.
  output_dir: checkpoints/run7_phase1/
  eval_every: 10              # flow val (참고용)
  perceptual_every: 1         # perceptual val 매 epoch — phase2 이관 시점 판단용(확인 사항 4)
  save_every: 5               # epoch 5/10/.../40 후보 저장 — 사후 선정 대상

# ⚠️ 판정에 best.pth를 쓰지 말 것 — best.pth 자동저장은 제거됨(trainer.py 학습루프 주석).
#   phase2로 넘길 epoch은 epoch_N.pth들의 perceptual val 로그(dE_unbraid/lpips_unbraid)를
#   보고 사후 수동 선정한다(final_retrain_plan.md 확인 사항 4). 무조건 epoch40이 아님.

# 착수 직후 필수 확인(run5_1 재현 여부):
#   - resume 직후 로그에 "Resumed from ... (epoch 15, step ...)" 출력되는지
#   - step ~10:        lpips_active_fraction ≈ 0.40 ± 0.03
#   - 전 구간:         densify_t 로그 키가 아예 없어야 한다
#   - R_lpips ∈ [0.015, 0.030] 유지되는지 (run5_1 실측 중앙 0.0262)
